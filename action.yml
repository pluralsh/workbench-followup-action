name: Plural Workbench Follow-up
description: Send a follow-up prompt to the Plural Workbench associated with a pull request.
author: Plural
branding:
  icon: message-circle
  color: purple

inputs:
  prompt:
    description: Follow-up prompt to send to the Workbench.
    required: true
  url:
    description: Pull request URL. Defaults to github.event.pull_request.html_url unless commit is set, then falls back to CLI inference.
    required: false
  commit:
    description: Commit or ref whose subject identifies the pull request. Defaults to HEAD when URL is omitted.
    required: false
  base-url:
    description: Repository web URL used to construct the pull request URL.
    required: false
  provider:
    description: Source control provider used for inference (auto, github, gitlab, or bitbucket).
    required: false
    default: auto
  defer:
    description: Duration to defer the follow-up, such as 30s, 5m, or 2h.
    required: false
    default: 0s
  output:
    description: CLI output format (raw or json). Structured action outputs are only available with json.
    required: false
    default: json
  skip-missing:
    description: Exit successfully when the pull request has no associated Workbench job.
    required: false
    default: "false"
outputs:
  prompt-id:
    description: ID of the created Workbench follow-up prompt.
    value: ${{ steps.follow-up.outputs.prompt-id }}
  pull-request-url:
    description: Pull request URL used for the follow-up.
    value: ${{ steps.follow-up.outputs.pull-request-url }}
  workbench-job-url:
    description: URL of the associated Workbench job.
    value: ${{ steps.follow-up.outputs.workbench-job-url }}
  skipped:
    description: Whether the follow-up was skipped because no Workbench job was found.
    value: ${{ steps.follow-up.outputs.skipped }}

runs:
  using: composite
  steps:
    - name: Send Workbench follow-up
      id: follow-up
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        INPUT_URL: ${{ inputs.url }}
        EVENT_PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
        COMMIT: ${{ inputs.commit }}
        BASE_URL: ${{ inputs.base-url }}
        PROVIDER: ${{ inputs.provider }}
        DEFER: ${{ inputs.defer }}
        OUTPUT: ${{ inputs.output }}
        SKIP_MISSING: ${{ inputs.skip-missing }}
      run: |
        set -euo pipefail

        PULL_REQUEST_URL="$INPUT_URL"
        if [[ -z "$PULL_REQUEST_URL" && -z "$COMMIT" ]]; then
          PULL_REQUEST_URL="$EVENT_PULL_REQUEST_URL"
        fi

        [[ -n "${PROMPT//[[:space:]]/}" ]] || { echo "::error::prompt is required" >&2; exit 1; }
        [[ -n "${PLURAL_CONSOLE_TOKEN:-}" ]] || { echo "::error::PLURAL_CONSOLE_TOKEN is required; run pluralsh/setup-plural first" >&2; exit 1; }
        [[ -n "${PLURAL_CONSOLE_URL:-}" ]] || { echo "::error::PLURAL_CONSOLE_URL is required; run pluralsh/setup-plural first" >&2; exit 1; }
        [[ -z "$PULL_REQUEST_URL" || -z "$COMMIT" ]] || { echo "::error::pull-request-url and commit cannot be used together" >&2; exit 1; }
        [[ "$PROVIDER" == "auto" || "$PROVIDER" == "github" || "$PROVIDER" == "gitlab" || "$PROVIDER" == "bitbucket" ]] || { echo "::error::provider must be auto, github, gitlab, or bitbucket" >&2; exit 1; }
        [[ "$OUTPUT" == "raw" || "$OUTPUT" == "json" ]] || { echo "::error::output must be raw or json" >&2; exit 1; }
        [[ "$SKIP_MISSING" == "true" || "$SKIP_MISSING" == "false" ]] || { echo "::error::skip-missing must be true or false" >&2; exit 1; }

        args=(
          workbenches pr-followup
          --prompt "$PROMPT"
          --provider "$PROVIDER"
          --defer "$DEFER"
          --output "$OUTPUT"
        )
        [[ -n "$PULL_REQUEST_URL" ]] && args+=(--url "$PULL_REQUEST_URL")
        [[ -n "$COMMIT" ]] && args+=(--commit "$COMMIT")
        [[ -n "$BASE_URL" ]] && args+=(--base-url "$BASE_URL")
        [[ "$SKIP_MISSING" == "true" ]] && args+=(--skip-missing)

        if [[ "$OUTPUT" == "raw" ]]; then
          plural "${args[@]}"
          exit 0
        fi

        result="$(plural "${args[@]}")"
        jq -e 'type == "object"' >/dev/null <<< "$result" || { echo "::error::plural returned an invalid JSON response" >&2; exit 1; }

        echo "prompt-id=$(jq -r '.promptId // empty' <<< "$result")" >> "$GITHUB_OUTPUT"
        echo "pull-request-url=$(jq -r '.pullRequestUrl // empty' <<< "$result")" >> "$GITHUB_OUTPUT"
        echo "workbench-job-url=$(jq -r '.workbenchJobUrl // empty' <<< "$result")" >> "$GITHUB_OUTPUT"
        echo "skipped=$(jq -r '.skipped // false' <<< "$result")" >> "$GITHUB_OUTPUT"
